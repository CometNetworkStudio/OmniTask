[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitask-sdk"
version = "0.2.1"
description = "OmniTask platform script SDK (stdio runtime + http/ratelimit/question-bank)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4",
  "requests>=2.28",
  "brotli>=1.1",
  "PySocks>=1.7",
]

[project.scripts]
omnitask-script = "omnitask_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["omnitask_sdk*"]

[tool.setuptools.package-data]
omnitask_sdk = ["script.schema.json"]
