name: omnitask

services:
  omnitask-db:
    image: mysql:8.0.31-debian
    container_name: omnitask-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: omnitask
    volumes:
      - omnitask-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  omnitask-redis:
    image: redis:6-alpine
    container_name: omnitask-redis
    restart: unless-stopped
    command: ["redis-server"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  omnitask-server:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      target: server
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: omnitask-server:local
    container_name: omnitask-server
    restart: unless-stopped
    init: true
    environment:
      OMNITASK_ADMIN_USER: ${OMNITASK_ADMIN_USER:-admin}
      OMNITASK_ADMIN_PASSWORD: ${OMNITASK_ADMIN_PASSWORD:-}
    depends_on:
      omnitask-db:
        condition: service_healthy
      omnitask-redis:
        condition: service_healthy
    volumes:
      - ${OMNITASK_CONFIG_TEMPLATE:-./config.full.yml}:/config-template/config.yml:ro
      - omnitask-server-config:/config
      - omnitask-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  omnitask-agent:
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      target: agent
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: omnitask-agent:local
    container_name: omnitask-agent
    restart: unless-stopped
    init: true
    depends_on:
      omnitask-server:
        condition: service_healthy
    volumes:
      - ./config.agent.yml:/config-template/config.yml:ro
      - omnitask-agent-config:/config
      - omnitask-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,sys; s=socket.create_connection(('127.0.0.1',50051),2); s.close(); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: omnitask-nginx
    restart: unless-stopped
    depends_on:
      omnitask-server:
        condition: service_healthy
    ports:
      - "${OMNITASK_BIND:-127.0.0.1}:${OMNITASK_PORT:-4096}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  omnitask-db-data:
  omnitask-server-config:
  omnitask-agent-config:
  omnitask-data:
