syntax = "proto3";

package agent.v1;

option go_package = "backend/api/agent/v1;agentv1";

// AgentService 是 Go 后端与 Python Agent 之间的唯一契约。
// 后端通过 Execute 下发任务，Agent 以 server-streaming 持续回传进度与结果。
service AgentService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  // Discover 列出该账号在平台上的条目（课程/任务等），用于前端选择。
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  // ListScripts 返回 Host 实际加载的脚本清单与运行时状态（后端以它为准同步注册表）。
  rpc ListScripts(ListScriptsRequest) returns (ListScriptsResponse);
}

message ListScriptsRequest {}

message ScriptInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string icon = 5;
  string runtime = 6;
  string manifest = 7; // 原始 omnitask.json
  string hash = 8;     // manifest sha256
  bool available = 9;
  string error = 10;   // 运行时不可用原因
  string runtime_path = 11;
}

message ListScriptsResponse {
  repeated ScriptInfo items = 1;
}

message DiscoverRequest {
  string platform = 1;
  map<string, string> params = 2;
  // 已由后端解密后下发的凭据，Agent 不得持久化。
  map<string, string> credentials = 3;
  // 账号级粘性代理，Host 以 OMNITASK_PROXY 注入脚本环境。
  string proxy = 4;
}

message DiscoverItem {
  string key = 1;                 // 唯一标识（如课程 ID）
  map<string, string> fields = 2; // 展示字段，key 对应 manifest 的 discovery.columns[].key
}

message DiscoverResponse {
  repeated DiscoverItem items = 1;
}

message HealthRequest {}

message HealthResponse {
  string version = 1;
  repeated string platforms = 2;
}

message ExecuteRequest {
  string task_id = 1;
  string platform = 2;
  string action = 3;
  map<string, string> params = 4;
  // 已由后端解密后下发的平台凭据，Agent 不得持久化。
  map<string, string> credentials = 5;
  // 账号级粘性代理，Host 以 OMNITASK_PROXY 注入脚本环境。
  string proxy = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_STARTED = 1;
  EVENT_TYPE_PROGRESS = 2;
  EVENT_TYPE_LOG = 3;
  EVENT_TYPE_SUCCEEDED = 4;
  EVENT_TYPE_FAILED = 5;
  EVENT_TYPE_STEP = 6;
  EVENT_TYPE_METRIC = 7;
  EVENT_TYPE_HEARTBEAT = 8;
}

message ExecuteEvent {
  string task_id = 1;
  EventType type = 2;
  int32 percent = 3;
  string message = 4;
  int64 timestamp = 5;
  map<string, string> result = 6;

  // 结构化展示字段（v2，全部可选，旧脚本无需填写）。
  bool has_percent = 7; // false 表示不改变任务进度
  string step = 8;      // 步骤标识
  string label = 9;     // 步骤/指标展示名
  string status = 10;   // 步骤状态：running | succeeded | failed | skipped
  string level = 11;    // 日志级别：debug | info | warn | error
  int32 current = 12;   // 当前进度
  int32 total = 13;     // 总量
  string unit = 14;     // 单位，如“节”“题”
  string key = 15;      // 指标 key
  string value = 16;    // 指标值
  string stage = 17;    // 阶段标识，如 watch / submit
  string result_json = 18; // 结构化结果（可为对象/数组），优先于 result map
}

// QuestionBank 由 Go 后端实现，Python Agent 作为客户端调用。
// 题库读写统一经此服务，Agent 不直连数据库。
service QuestionBank {
  // Lookup 按 platform + question_key 查询题库。
  rpc Lookup(LookupRequest) returns (LookupResponse);
  // Save 回写答案（按 platform + question_key 幂等 upsert）。
  rpc Save(SaveRequest) returns (SaveResponse);
}

message Question {
  string platform = 1;
  string question_key = 2;
  string stem = 3;
  // JSON 字符串，保持平台返回的选项原始结构。
  string options = 4;
  // JSON 字符串，答案形态随题型变化。
  string answer = 5;
  // 来源：bank | api | llm。
  string source = 6;
  double confidence = 7;
  int64 hit_count = 8;
}

message LookupRequest {
  string platform = 1;
  string question_key = 2;
}

message LookupResponse {
  bool found = 1;
  Question question = 2;
}

message SaveRequest {
  Question question = 1;
  // 仅在缺失时写入为默认；true 表示覆盖已有记录。
  bool overwrite = 2;
}

message SaveResponse {
  bool saved = 1;
}
