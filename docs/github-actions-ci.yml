name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build/vet/test
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./...

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install grpcio protobuf requests brotli
      - name: sdk tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -t .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build
        working-directory: frontend
        run: |
          npm ci
          npm run build
